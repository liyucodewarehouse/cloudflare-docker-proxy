name = "cloudflare-docker-proxy"
main = "src/index.js"
compatibility_date = "2023-12-01"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[vars]
CUSTOM_DOMAIN = "lcyd.cloud"

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = "lcyd.cloud"

[env.production]
name = "cloudflare-docker-proxy"
routes = [
  { pattern = "docker.lcyd.cloud", custom_domain = true },
  { pattern = "ghcr.lcyd.cloud", custom_domain = true },
  { pattern = "gcr.lcyd.cloud", custom_domain = true },
  { pattern = "k8s.lcyd.cloud", custom_domain = true },
  { pattern = "quay.lcyd.cloud", custom_domain = true },
]

[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = "lcyd.cloud"

[env.staging]
name = "cloudflare-docker-proxy-staging"

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
